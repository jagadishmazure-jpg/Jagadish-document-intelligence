[project]
name = "docintel"
version = "0.1.0"
description = "Enterprise intelligent document processing: extract, validate, review, post. 100% synthetic demo data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
